<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Campus Lost & Found</h1>

  <!-- Shows who is signed in, or a sign-in button -->
  <div id="authBar" class="auth-bar"></div>

  <!-- SIGN IN with email code -->
  <div id="loginBox" class="post-form" hidden>
    <h2>Sign in</h2>

    <div id="stepEmail">
      <input type="email" id="loginEmail" placeholder="Your email" autocomplete="email" maxlength="120">
      <button type="button" id="sendCodeBtn">Send code</button>
    </div>

    <div id="stepCode" hidden>
      <input type="text" id="loginCode" placeholder="Code from your email" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button type="button" id="verifyBtn">Verify</button>
      <button type="button" id="backBtn" class="link-btn">Use a different email</button>
    </div>

    <p id="loginStatus" class="status"></p>
  </div>

  <!-- POST FORM (only visible when signed in) -->
  <form class="post-form" hidden>
    <h2>Post an item</h2>
    <select id="type">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <input type="text" id="name" placeholder="Your name" maxlength="60" required>
    <input type="text" id="title" placeholder="Item name (e.g. Black wallet)" maxlength="100" required>
    <input type="text" id="place" placeholder="Where?" maxlength="100" required>

    <!-- PHOTO: camera or gallery -->
    <p class="photo-label">Photo (optional)</p>
    <div class="photo-buttons">
      <label for="cameraPhoto" class="pick-btn">📷 Take photo</label>
      <label for="galleryPhoto" class="pick-btn">🖼️ Gallery</label>
    </div>
    <input type="file" id="cameraPhoto" class="hidden-input" accept="image/*" capture="environment">
    <input type="file" id="galleryPhoto" class="hidden-input" accept="image/*">
    <p id="photoStatus" class="status"></p>

    <!-- LOCATION: auto-detect or pin on map -->
    <p class="photo-label">Location (optional)</p>
    <div class="photo-buttons">
      <button type="button" id="autoBtn" class="loc-btn">📡 Auto-detect</button>
      <button type="button" id="pinBtn" class="loc-btn">📍 Pin on map</button>
    </div>
    <div id="mapBox" class="map-box">
      <div id="pickMap"></div>
      <p class="map-hint">Tap the map or drag the pin to the exact spot. Use the layers button (top right of the map) for Satellite or Terrain.</p>
    </div>
    <p id="locationStatus" class="status"></p>

    <button type="submit">Post</button>
  </form>

  <p id="feedStatus" class="feed-status"></p>
  <p id="stats" class="stats"></p>
  <div id="feed"></div>

  <!-- CHAT WINDOW -->
  <div id="chatModal" class="chat-modal" hidden>
    <div class="chat-panel">
      <div class="chat-head">
        <strong id="chatTitle"></strong>
        <button type="button" id="chatClose" aria-label="Close chat">✕</button>
      </div>
      <div id="threadList" class="thread-list" hidden></div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form" hidden>
        <input type="text" id="chatInput" maxlength="500" placeholder="Type a message" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
