<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Campus Lost & Found</h1>

  <form class="post-form">
    <h2>Post an item</h2>
    <select id="type">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <input type="text" id="name" placeholder="Your name" maxlength="60" required>
    <input type="text" id="title" placeholder="Item name (e.g. Black wallet)" maxlength="100" required>
    <input type="text" id="place" placeholder="Where?" maxlength="100" required>
    <input type="tel" id="whatsapp" placeholder="WhatsApp number (e.g. 0123456789)" maxlength="10" required>
    <p class="note">Your WhatsApp number is shown on your post so people can contact you.</p>

    <!-- PHOTO: camera or gallery -->
    <p class="photo-label">Photo (optional)</p>
    <div class="photo-buttons">
      <label for="cameraPhoto" class="pick-btn">📷 Take photo</label>
      <label for="galleryPhoto" class="pick-btn">🖼️ Gallery</label>
    </div>
    <input type="file" id="cameraPhoto" class="hidden-input" accept="image/*" capture="environment">
    <input type="file" id="galleryPhoto" class="hidden-input" accept="image/*">
    <p id="photoStatus" class="status"></p>

    <!-- LOCATION: auto-detect or pin on map -->
    <p class="photo-label">Location (optional)</p>
    <div class="photo-buttons">
      <button type="button" id="autoBtn" class="loc-btn">📡 Auto-detect</button>
      <button type="button" id="pinBtn" class="loc-btn">📍 Pin on map</button>
    </div>
    <div id="mapBox" class="map-box">
      <div id="pickMap"></div>
      <p class="map-hint">Tap the map or drag the pin to the exact spot. Use the layers button (top right of the map) for Satellite or Terrain.</p>
    </div>
    <p id="locationStatus" class="status"></p>

    <button type="submit">Post</button>
  </form>

  <!-- SEARCH + FILTER -->
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="🔍 Search item, place or name">
    <div class="chips">
      <button type="button" class="chip active" data-filter="all">All</button>
      <button type="button" class="chip" data-filter="lost">Lost</button>
      <button type="button" class="chip" data-filter="found">Found</button>
      <button type="button" class="chip" data-filter="solved">Solved ✅</button>
    </div>
  </div>

  <p id="stats" class="stats"></p>
  <p id="feedStatus" class="feed-status"></p>
  <div id="feed"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
